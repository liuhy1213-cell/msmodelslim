# IQuest-Q1 W8A8 (MXFP8) —— v1：只量化线性层
#
# 与 iquest_q1_w8a8c8_mxfp8.yaml 的差别：
#   - 去掉 fa3_quant：KV cache 保持 bf16，先单独验证权重侧量化精度
#   - linear_quant 的 include/exclude 与 W8A8C8 配方完全一致
#     （attention 投影 + 256 路专家 + layer0 稠密 MLP；sink 排除）
#   - 全流程 data-free：mxfp8 per_block 的 act/weight quantizer 都返回 is_data_free
apiversion: modelslim_v1

metadata:
  config_id: iquest_q1_w8a8_linear_mxfp8
  score: 90
  verified_model_types:
    - IQuest-Q1
  label:
    w_bit: 8
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w8a8_dynamic: &mxfp8_w8a8
  act:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_block"
    dtype: "mxfp8"
    symmetric: True
    method: "minmax"

spec:
  process:
    - type: "linear_quant"
      qconfig: *mxfp8_w8a8
      include:
        - "*self_attn*"
        - "*mlp.experts*"
        - "model.layers.0.mlp.gate_proj"
        - "model.layers.0.mlp.up_proj"
        - "model.layers.0.mlp.down_proj"
      exclude:
        - "*sink*"
  dataset: mix_calib.jsonl
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
